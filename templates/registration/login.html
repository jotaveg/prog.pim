{% extends 'base.html' %}

{% block title %}Entrar | Sistema Colaborativo Acadêmico{% endblock %}

{% block content %}
<div class="form-card centered-card">
    <h1 class="title-xl">Acesse sua conta</h1>
    <p class="page-note">Use as credenciais de demonstração para explorar o MVP.</p>

    {% if form.errors %}
        <div class="form-error">
            Usuário ou senha inválidos.
        </div>
    {% endif %}

    <form method="post" class="layout-stack-lg">
        {% csrf_token %}
        <div class="form-group">
            <label class="field-label" for="id_username">Usuário</label>
            <input class="input" type="text" name="username" autofocus required id="id_username">
        </div>
        <div class="form-group">
            <label class="field-label" for="id_password">Senha</label>
            <input class="input" type="password" name="password" required id="id_password">
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn-primary full-width" type="submit">Entrar</button>
    </form>
</div>
{% endblock %}
