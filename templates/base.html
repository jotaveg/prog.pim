<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema Colaborativo Acadêmico{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <header class="page-header">
        <div class="page-header-inner">
            <a href="{% url 'landing' %}" class="brand">
                Sistema Colaborativo Acadêmico
            </a>
            <nav class="nav">
                <a class="nav-link" href="{% url 'landing' %}">Início</a>
                {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
                    <a class="nav-link" href="{% url 'project-list' %}">Projetos</a>
                    <a class="nav-link" href="{% url 'profile' %}">Perfil</a>
                    <a class="nav-button" href="{% url 'logout' %}">Sair</a>
                {% else %}
                    <a class="nav-button" href="{% url 'login' %}">Entrar</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="page-main">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
